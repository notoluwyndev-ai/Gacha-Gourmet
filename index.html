<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183b35">
    <title>Gacha Gourmet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="data/cards.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <button class="profile-chip" type="button" data-action="placeholder" data-message="Perfil de chef · Próximamente">
          <span class="profile-avatar" aria-hidden="true">✦</span><span>Chef gourmet</span>
        </button>
        <a class="mini-brand" href="#inicio" aria-label="Gacha Gourmet, inicio" data-screen-link="packs">G<span>G</span></a>
        <div class="player-stats">
          <div class="stat-chip coin-chip"><span aria-hidden="true">●</span><strong id="coin-count">0</strong></div>
          <div class="stat-chip album-chip"><span aria-hidden="true">▤</span><strong id="collection-count">0/0</strong></div>
        </div>
      </header>

      <main>
        <p id="fatal-error" class="fatal-error" role="alert" hidden></p>
        <p id="game-message" class="game-message" role="status" aria-live="polite"></p>

        <section class="screen" id="screen-packs" aria-labelledby="packs-title">
          <div class="home-title-row">
            <div class="stage-title">Sobres disponibles</div>
            <button class="highlights-button" type="button" data-action="placeholder" data-message="Cartas destacadas · Próximamente" aria-label="Cartas destacadas">✦</button>
          </div>
          <div class="carousel">
            <button class="arrow" type="button" data-action="placeholder" data-message="Más sobres llegarán pronto" aria-label="Sobre anterior">‹</button>
            <div class="pack-card">
              <span class="bubble" aria-hidden="true">1</span>
              <span class="pack-emblem-small" aria-hidden="true">✦</span>
              <strong class="pack-set-name">Menú secreto</strong>
              <span class="pack-set-edition">COLECCIÓN DE TEMPORADA</span>
            </div>
            <button class="arrow" type="button" data-action="placeholder" data-message="Más sobres llegarán pronto" aria-label="Sobre siguiente">›</button>
          </div>
          <div class="pbar-wrap">
            <div class="pbar-label"><span>Garantía Ultra rara</span><span id="home-pity-label">0/19</span></div>
            <div class="pbar" role="progressbar" aria-label="Progreso de garantía Ultra rara" aria-valuemin="0" aria-valuemax="19" aria-valuenow="0"><i id="home-pity-fill"></i></div>
          </div>
          <button class="open-btn" id="home-open-button" type="button" data-action="buy-pack">ABRIR</button>
          <p class="open-sub" id="home-pack-sub"></p>

          <div class="home-shortcuts" aria-label="Accesos rápidos">
            <button class="fab" type="button" data-action="placeholder" data-message="Eventos · Próximamente">
              <span class="fab-circle">✷</span><span class="fab-label">Eventos</span>
            </button>
            <button class="fab" type="button" data-action="placeholder" data-message="Misiones · Próximamente">
              <span class="fab-circle">◎</span><span class="fab-label">Misiones</span>
            </button>
          </div>
          <aside class="home-odds">
            <p id="pity-note" class="pity-note" role="status" aria-live="polite" aria-atomic="true" hidden></p>
            <div id="pity-progress" class="pity-progress" aria-hidden="true" hidden><span id="pity-progress-fill"></span></div>
            <details class="odds-disclosure">
              <summary><span class="odds-summary-icon" aria-hidden="true">%</span><span><strong id="odds-title">Probabilidades</strong><small>Por carta · tasas claras</small></span><span class="odds-chevron" aria-hidden="true">⌄</span></summary>
              <p class="panel-copy">Cada carta se sortea por separado.</p>
              <div id="pack-odds" class="odds-list"></div>
              <div class="odds-footnote"><span aria-hidden="true">✳</span> Un sobre no garantiza una rareza concreta.</div>
              <button class="reset-button home-reset" type="button" data-action="reset">Reiniciar partida</button>
            </details>
          </aside>
        </section>

        <section class="screen" id="screen-opening" aria-label="Apertura del sobre" hidden>
          <div class="opening-topline"><button class="back-button" type="button" data-action="return-home" aria-label="Volver al inicio">‹</button><span>MENÚ SECRETO</span><span aria-hidden="true">✦</span></div>
          <section id="pack-area" class="pack-area" aria-live="polite"></section>
        </section>

        <section class="screen" id="screen-album" aria-labelledby="album-title" hidden>
          <div class="page-heading album-heading">
            <div>
              <p class="eyebrow"><span class="eyebrow-dot"></span> TU LIBRO DE RECETAS</p>
              <h1 id="album-title">El álbum</h1>
              <p class="heading-copy" id="album-summary"></p>
            </div>
            <div class="album-progress" aria-label="Progreso del álbum">
              <span id="album-progress-label">0 %</span>
              <div class="progress-track"><span id="album-progress-bar"></span></div>
            </div>
          </div>
          <div class="album-toolbar">
            <div class="filter-list" role="group" aria-label="Filtrar por categoría">
              <button class="filter-button is-active" type="button" data-category="Todas" aria-pressed="true">Todas</button>
              <button class="filter-button" type="button" data-category="Horno" aria-pressed="false">Horno</button>
              <button class="filter-button" type="button" data-category="Nevera" aria-pressed="false">Nevera</button>
              <button class="filter-button" type="button" data-category="Postre" aria-pressed="false">Postre</button>
              <button class="filter-button" type="button" data-category="Fast Food" aria-pressed="false">Fast food</button>
              <button class="filter-button" type="button" data-category="Huerta" aria-pressed="false">Huerta</button>
              <button class="filter-button" type="button" data-category="Despensa" aria-pressed="false">Despensa</button>
            </div>
            <label class="rarity-filter"><span>Rareza</span>
              <select id="rarity-filter" aria-label="Filtrar por rareza">
                <option value="Todas">Todas</option>
                <option value="comun">Común</option>
                <option value="rara">Rara</option>
                <option value="ultra">Ultra rara</option>
              </select>
            </label>
            <label class="owned-toggle"><input id="owned-only" type="checkbox"><span class="toggle-track"></span><span>Solo obtenidas</span></label>
          </div>
          <div id="album-grid" class="album-grid"></div>
        </section>
      </main>

      <nav class="bottom-dock" aria-label="Navegación principal">
        <button class="dock-button" type="button" data-action="placeholder" data-message="Tienda · Próximamente">
          <span class="dock-icon" aria-hidden="true">⌂</span><span>Tienda</span>
        </button>
        <button class="dock-button" type="button" data-screen="album" aria-pressed="false">
          <span class="dock-icon" aria-hidden="true">▤</span><span>Cartas</span>
        </button>
        <button class="dock-button dock-center" type="button" data-action="placeholder" data-message="Social · Próximamente" aria-label="Social">
          <span class="dock-icon" aria-hidden="true">✦</span>
        </button>
        <button class="dock-button" type="button" data-action="placeholder" data-message="Batallas · Próximamente">
          <span class="dock-icon" aria-hidden="true">⚔</span><span>Batalla</span>
        </button>
        <button class="dock-button" type="button" data-action="placeholder" data-message="Menú · Próximamente">
          <span class="dock-icon" aria-hidden="true">≡</span><span>Menú</span>
        </button>
      </nav>
    </div>
  </body>
</html>
